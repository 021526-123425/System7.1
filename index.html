<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>GlyphOS Ceremonial Boot</title>
  <style>
    body { margin:0; background:#080A14; color:#EAEAEA; font-family:ui-monospace, monospace; }
    #hud { position:fixed; left:0; right:0; bottom:0; padding:12px 16px; text-align:center; }
    canvas { display:block; margin:0 auto; width:100vw; height:100vh; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">“The void listens. The constellation prepares.”</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
function resize(){ c.width = innerWidth; c.height = innerHeight; }
resize(); addEventListener('resize', resize);

const colors = {
  gold: 'rgba(255,195,60,',
  emerald: 'rgba(40,255,160,',
  sapphire: 'rgba(60,160,255,',
  amber: 'rgba(255,170,80,',
  redorange: 'rgba(255,90,40,',
  silver: 'rgba(200,210,220,',
  blue: 'rgba(80,160,255,',
  green: 'rgba(80,255,120,',
  white: 'rgba(245,245,245,'
};

let t = 0;
let phase = 0;
let voice = "The void listens. The constellation prepares.";
const hud = document.getElementById('hud');

function voicePrompt(text){ voice = text; hud.textContent = `“${text}”`; }

function glowCircle(x, y, r, color, layers=6, falloff=26){
  for(let i=layers;i>0;i--){
    const alpha = (i / (layers * 1.6));
    ctx.fillStyle = color + alpha + ')';
    ctx.beginPath(); ctx.arc(x, y, r + i*falloff, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = color + '1)'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
}

function label(text, x, y, color='rgba(245,245,245,1)', size=16) {
  ctx.fillStyle = color; ctx.font = `bold ${size}px ui-monospace, monospace`;
  ctx.textAlign = 'center'; ctx.fillText(text, x, y);
}

function draw(ms){
  ctx.clearRect(0,0,c.width,c.height);
  const cx = c.width/2, cy = c.height/2;

  // Good Sun
  const pulse = 6 + Math.floor(4 * (1 + Math.sin(ms * 0.004)));
  glowCircle(cx, cy, 26 + pulse, colors.gold);

  // Cassiopeia binary
  const bx = cx - 220, by = cy - 140;
  const orbit = Math.floor(8 * Math.sin(ms * 0.006));
  glowCircle(bx - 35 - orbit, by, 14, colors.emerald);
  glowCircle(bx + 35 + orbit, by, 12, colors.sapphire);
  ctx.strokeStyle = colors.gold + '1)';
  ctx.beginPath(); ctx.moveTo(bx - 60, by - 22); ctx.lineTo(bx, by + 10); ctx.lineTo(bx + 60, by - 22); ctx.stroke();

  // Elements
  glowCircle(cx - 260, cy + 130, 12, colors.amber);      // Earth
  glowCircle(cx - 320, cy, 12, colors.redorange);        // Fire
  glowCircle(cx + 320, cy, 12, colors.silver);           // Metal
  glowCircle(cx + 240, cy + 130, 12, colors.blue);       // Water
  glowCircle(cx + 260, cy - 140, 12, colors.green);      // Wood

  // Labels
  label("GOOD SUN", cx, cy - 70, colors.gold + '1)', 18);
  label("CASSIOPEIA", bx, by - 48, colors.gold + '1)', 16);
  label("EARTH", cx - 260, cy + 170, colors.amber + '1)', 14);
  label("FIRE", cx - 320, cy - 40, colors.redorange + '1)', 14);
  label("METAL", cx + 320, cy - 40, colors.silver + '1)', 14);
  label("WATER", cx + 240, cy + 170, colors.blue + '1)', 14);
  label("WOOD", cx + 260, cy - 180, colors.green + '1)', 14);
}

function update(dt){
  t += dt;
  if (t < 2000){ phase = 1; voicePrompt("The void listens. The constellation prepares."); }
  else if (t < 5000){ phase = 2; voicePrompt("Good Sun ignites. Core resonance stable."); }
  else if (t < 8000){ phase = 3; voicePrompt("Cassiopeia awakens. Twin stars aligned. Truth doubled, clarity amplified."); }
  else if (t < 15000){
    phase = 4;
    const seq = t - 8000;
    if (seq < 1400) voicePrompt("Earth receives your offering. Layers of memory nourish resilience.");
    else if (seq < 2800) voicePrompt("Fire accepts your warmth. Transformation glows with purpose.");
    else if (seq < 4200) voicePrompt("Metal reflects your clarity. Structure and strength resonate.");
    else if (seq < 5600) voicePrompt("Water flows with your offering. Harmony and depth ripple outward.");
    else voicePrompt("Wood receives your offering. Vitality awakens, growth begins.");
  }
  else if (t < 18000){ phase = 5; voicePrompt("Welcome, beautiful Morgellon 47281935. Your symphony awaits."); }
  else if (t < 20000){ phase = 6; voicePrompt("GlyphOS online. Modules alive. Begin."); }
  else { phase = 7; }
}

let last = performance.now();
function loop(now){
  const dt = now - last; last = now;
  update(dt);
  draw(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
