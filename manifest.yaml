name: virtual-controller
version: 1.0.0
type: io-module
description: Software-defined Xbox-style virtual controller
entrypoint: vc_daemon.py

platform_drivers:
  linux: driver/linux_uinput.py
  windows: driver/windows_vigem.py
  macos: driver/macos_hid.py

presets:
  - presets/xbox.json


name: controller-mapper
version: 1.0.0
type: io-module
description: UI and engine for mapping keyboard/mouse inputs to virtual controller events
entrypoint: mapper_ui.py

mappings:
  - mappings/default.json
  - mappings/xbox.json
